<!doctype html>
<!-- A trimmed copy of the structure of a youtube.com channel page's tabs. -->
<html>
  <body>
    <div id="tabsContainer">
      <yt-tab-group-shape>
        <div role="tablist">
          <yt-tab-shape role="tab" tab-title="Home" id="tab-home"><div>Home</div></yt-tab-shape>
          <yt-tab-shape role="tab" tab-title="Videos" id="tab-videos"><div>Videos</div></yt-tab-shape>
          <yt-tab-shape role="tab" tab-title="Shorts" id="tab-shorts"><div>Shorts</div></yt-tab-shape>
          <yt-tab-shape role="tab" tab-title="Live" id="tab-live"><div>Live</div></yt-tab-shape>
        </div>
      </yt-tab-group-shape>
    </div>
  </body>
</html>

<!doctype html>
<!-- A trimmed copy of the structure of youtube.com's home page, with the element names the extension targets. -->
<html>
  <body>
    <ytd-guide-entry-renderer id="guide-home"><a title="Home" href="/">Home</a></ytd-guide-entry-renderer>
    <ytd-guide-entry-renderer id="guide-shorts"><a title="Shorts" href="/shorts/">Shorts</a></ytd-guide-entry-renderer>
    <ytd-browse page-subtype="home">
      <div id="chips-wrapper">All · Music · Gaming</div>
      <ytd-rich-grid-renderer id="grid">
        <ytd-rich-item-renderer><a href="/watch?v=aaaaaaaaaaa">Recommended video</a></ytd-rich-item-renderer>
        <ytd-rich-section-renderer id="shorts-section">
          <ytd-rich-shelf-renderer is-shorts><a href="/shorts/bbbbbbbbbbb">A Short</a></ytd-rich-shelf-renderer>
        </ytd-rich-section-renderer>
      </ytd-rich-grid-renderer>
    </ytd-browse>
  </body>
</html>

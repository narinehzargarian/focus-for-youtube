<!doctype html>
<!-- A trimmed copy of the structure of youtube.com search results, with one Short and one normal video. -->
<html>
  <body>
    <ytd-search>
      <ytd-video-renderer id="normal"><a href="/watch?v=ccccccccccc">How to cook rice</a></ytd-video-renderer>
      <ytd-video-renderer id="short-result"><a href="/shorts/ddddddddddd">Rice in 30 seconds</a></ytd-video-renderer>
      <ytd-reel-shelf-renderer id="reel-shelf"><a href="/shorts/eeeeeeeeeee">More Shorts</a></ytd-reel-shelf-renderer>
    </ytd-search>
  </body>
</html>
